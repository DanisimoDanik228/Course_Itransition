name: CI/CD .NET Docker

on:
  push:
    branches: [ "master","dev" ]
  pull_request:
    branches: [ "master","dev" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: danisimodanik228/course_itransition 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check code
        uses: actions/checkout@v4

      - name: Put on server
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        run: |
          docker compose build
          docker compose push

  deploy:
    needs: build-and-push
    runs-on: self-hosted 
    
    steps:
      - name: Check code
        uses: actions/checkout@v4 

      - name: Take the server
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }} 

      - name: Deploy
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
