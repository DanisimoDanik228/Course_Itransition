name: CI/CD .NET Docker

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: danisimodanik228/course_itransition 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check code
        uses: actions/checkout@v4

      - name: Put on server
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create env file for build
        run: |
          touch .env
          echo "SALESFORCE_ENDPOINTURL=${{ secrets.SALESFORCE_ENDPOINTURL }}" >> .env
          echo "SALESFORCE_SOBJECTNAME=${{ secrets.SALESFORCE_SOBJECTNAME }}" >> .env
          echo "SALESFORCE_APIVERSION=${{ secrets.SALESFORCE_APIVERSION }}" >> .env
          echo "SALESFORCE_CLIENTID=${{ secrets.SALESFORCE_CLIENTID }}" >> .env
          echo "SALESFORCE_CONSUMERSECRET=${{ secrets.SALESFORCE_CONSUMERSECRET }}" >> .env
          
      - name: Build and Push
        run: |
          docker compose build
          docker compose push

  deploy:
    needs: build-and-push
    runs-on: self-hosted 
    
    permissions:
      contents: read
      packages: read
    
    steps:
      - name: Check code
        uses: actions/checkout@v4 

      - name: Take the server
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create env file for deploy
        run: |
          touch .env
          echo "SALESFORCE_ENDPOINTURL=${{ secrets.SALESFORCE_ENDPOINTURL }}" >> .env
          echo "SALESFORCE_SOBJECTNAME=${{ secrets.SALESFORCE_SOBJECTNAME }}" >> .env
          echo "SALESFORCE_APIVERSION=${{ secrets.SALESFORCE_APIVERSION }}" >> .env
          echo "SALESFORCE_CLIENTID=${{ secrets.SALESFORCE_CLIENTID }}" >> .env
          echo "SALESFORCE_CONSUMERSECRET=${{ secrets.SALESFORCE_CONSUMERSECRET }}" >> .env

      - name: Deploy
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
