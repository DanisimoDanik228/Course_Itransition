services:
    course:
        image: ghcr.io/danisimodanik228/course_itransition 
        env_file:
            - .env  
        build:
            context: .
            dockerfile: Course/Dockerfile
        ports:
            - "5005:8080"
        depends_on:
            - db
            - elasticsearch

    db:
        image: postgres:latest
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: Trainee

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.0
        container_name: elasticsearch
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
        ports:
            - "9200:9200"
